name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 哑密钥：测试全量 mock LLM 与搜索接口，仅需通过 graph.py 的启动检查
      DEEPSEEK_API_KEY: sk-dummy-key-for-ci
      TAVILY_API_KEY: tvly-dummy-key-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v
